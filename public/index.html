<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e5f">
  <meta name="description" content="Voice-first symptom triage, community health worker support and AI-assisted basic diagnostics.">
  <title>Health AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/icons/icon.svg" alt="" width="28" height="28"><span>Health AI</span></div>
    <div class="status">
      <span id="badge-demo" class="badge warn" hidden></span>
      <span id="badge-offline" class="badge" hidden>Offline</span>
      <button id="badge-sync" class="badge" type="button" hidden></button>
    </div>
  </header>

  <main id="main">
    <!-- TALK: voice-first triage -->
    <section id="view-talk" class="view" data-view="talk">
      <div class="intro" id="talk-intro">
        <h1 data-i18n="talk_title"></h1>
        <p data-i18n="talk_intro"></p>
      </div>

      <details class="card person" id="person-details">
        <summary data-i18n="about_person"></summary>
        <div class="grid3">
          <label><span data-i18n="age"></span><input id="p-age" type="number" min="0" max="130" inputmode="decimal"></label>
          <label><span data-i18n="age_months"></span><input id="p-months" type="number" min="0" max="59" inputmode="numeric"></label>
          <label><span data-i18n="sex"></span>
            <select id="p-sex"><option value=""></option><option value="female" data-i18n="female"></option><option value="male" data-i18n="male"></option><option value="other" data-i18n="other"></option></select>
          </label>
        </div>
        <label class="check" id="p-pregnant-wrap"><input id="p-pregnant" type="checkbox"> <span data-i18n="pregnant"></span></label>
      </details>

      <div id="chat" class="chat" aria-live="polite"></div>

      <div class="composer">
        <button id="mic" class="mic" type="button" aria-label="Tap to speak">
          <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <div id="mic-label" class="mic-label" data-i18n="tap_to_speak"></div>
        <form id="text-form" class="text-form">
          <input id="text-input" autocomplete="off" data-i18n-placeholder="type_placeholder">
          <button class="btn primary" type="submit" data-i18n="send"></button>
        </form>
        <button id="reset-chat" class="btn link" type="button" data-i18n="new_conversation"></button>
      </div>
    </section>

    <!-- CHW: patients, protocols, encounters -->
    <section id="view-chw" class="view" data-view="chw" hidden></section>

    <!-- SCAN: AI-assisted image diagnostics -->
    <section id="view-scan" class="view" data-view="scan" hidden>
      <h1 data-i18n="scan_title"></h1>
      <p class="muted" data-i18n="scan_intro"></p>
      <div class="card">
        <div class="seg" id="scan-kind" role="radiogroup"></div>
        <label class="photo-btn btn"><input id="scan-file" type="file" accept="image/*" capture="environment" hidden><span data-i18n="take_photo"></span></label>
        <img id="scan-preview" class="preview" alt="" hidden>
        <label><span data-i18n="notes"></span><textarea id="scan-notes" rows="2"></textarea></label>
        <label><span data-i18n="attach_patient"></span><select id="scan-patient"></select></label>
        <button id="scan-go" class="btn primary block" type="button" data-i18n="analyze" disabled></button>
      </div>
      <div id="scan-result"></div>
    </section>

    <!-- REVIEW: clinician oversight -->
    <section id="view-review" class="view" data-view="review" hidden>
      <h1 data-i18n="review_title"></h1>
      <div id="metrics" class="metrics"></div>
      <div class="seg" id="review-filter"></div>
      <div id="review-list"></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" data-view="settings" hidden>
      <h1 data-i18n="tab_settings"></h1>
      <div class="card">
        <label><span data-i18n="language"></span><select id="set-lang"></select></label>
        <label class="check"><input id="set-voice" type="checkbox"> <span data-i18n="voice_output"></span></label>
      </div>
      <div class="card">
        <label><span data-i18n="access_token"></span>
          <div class="row"><input id="set-token" type="password" autocomplete="off"><button id="set-token-apply" class="btn" type="button" data-i18n="apply"></button></div>
        </label>
        <p class="muted"><span data-i18n="role"></span>: <strong id="set-role"></strong></p>
        <p class="muted"><span data-i18n="emergency_number"></span>: <strong id="set-emergency"></strong></p>
      </div>
      <div class="card muted small">
        <p data-i18n="disclaimer"></p>
        <p>Safety rules run on this device and on the server, and the AI can never lower a level they set. Clinical rules must be validated locally before real-world use.</p>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="talk"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><span data-i18n="tab_talk"></span></button>
    <button data-tab="chw" data-role="chw" hidden><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-8 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm8 1c-2.7 0-8 1.3-8 4v3h16v-3c0-2.7-5.3-4-8-4Zm-8 0c-.3 0-.7 0-1.1.1A4.7 4.7 0 0 1 9 17v3H1v-2.5C1 15 5.7 13 8 13Z"/></svg><span data-i18n="tab_chw"></span></button>
    <button data-tab="scan" data-role="chw" hidden><svg viewBox="0 0 24 24"><path d="M12 17a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm-8-12h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg><span data-i18n="tab_scan"></span></button>
    <button data-tab="review" data-role="clinician" hidden><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4Z"/></svg><span data-i18n="tab_review"></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1L11 21h4l.4-2.9a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg><span data-i18n="tab_settings"></span></button>
  </nav>

  <dialog id="consent">
    <h2 data-i18n="consent_title"></h2>
    <p data-i18n="consent_body"></p>
    <form method="dialog"><button class="btn primary block" data-i18n="consent_accept"></button></form>
  </dialog>
</body>
</html>
